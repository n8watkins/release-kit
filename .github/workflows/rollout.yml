# The rollout bot (docs/ROADMAP.md, item 8): after a kit release, run apply in
# every adopter listed in adopters.json and open one pull request each, from
# the release-kit/update branch, as the "release-kit bot" GitHub App.
# Waves run in order (canary, public, private), and a wave starts only when the
# one before it succeeded.
#
# A patch or minor release needs no one, and it soaks on the canary first:
# after the canary wave, the gate waits (up to an hour) for the canary's update
# pull request to pass CI and merge, and the run ends there (the job "Later
# waves wait for the soak"). rollout-resume.yml looks every hour, and once the
# canary has run the release for adopters.json "soakHours" (default 24) and
# is healthy (its branch still pins the release and every check on its head
# commit passed), it starts this workflow again with stage "later": the
# public and private waves, after the same soak and health check. "Run
# workflow" with skip_soak on starts them right after the canary merges, for
# an urgent fix. A major release waits for the owner's approval in the
# `rollout-major` environment before each wave instead, since its update pull
# requests wait for a person anyway.
# Any failure stops the waves after it, and the report job opens (or comments
# on) an issue labeled "release-kit: rollout" naming the failed jobs.
#
# The App's key is in the `rollout` environment, which only main and v* tags
# may use; `rollout-major` holds no secrets, only the required reviewer.
#
# The Release workflow publishes with its own token, which starts no
# "release: published" run; rollout-start.yml starts this workflow instead.
# A release a person publishes starts it here. The concurrency group queues a
# second run behind the first, but doesn't drop it: rollout-start.yml skips a
# tag that already rolled out.
name: Rollout
# The tag in the name lets rollout-start.yml see that a tag already rolled out.
run-name: Rollout ${{ inputs.tag || github.event.release.tag_name }}${{ inputs.stage == 'later' && ' (later waves)' || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release-kit tag to roll out, like v2.6.0"
        required: true
        type: string
      repos:
        description: "Only these adopters, comma-separated (empty: every enabled one)"
        type: string
        default: ""
      dry_run:
        description: "Dry run: run apply and show each pull request, but push nothing"
        type: boolean
        default: true
      stage:
        description: "auto: the canary, then the later waves after the soak (a major: every wave, each approved). later: only the public and private waves, once the canary has soaked"
        type: choice
        options: [auto, later]
        default: auto
      skip_soak:
        description: "Urgent fix: start the public and private waves without waiting for the canary's soak"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollout
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the waves
    # A pre-release is for testers, not for every adopter.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      dry-run: ${{ steps.tag.outputs.dry-run }}
      canary: ${{ steps.plan.outputs.canary }}
      public: ${{ steps.plan.outputs.public }}
      private: ${{ steps.plan.outputs.private }}
      major: ${{ steps.plan.outputs.major }}
      later: ${{ steps.plan.outputs.later }}
      soak-hours: ${{ steps.plan.outputs.soak-hours }}
      canaries: ${{ steps.plan.outputs.canaries }}
      canary-owner: ${{ steps.plan.outputs.canary-owner }}
      canary-names: ${{ steps.plan.outputs.canary-names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$TAG\" is not a release tag like v2.6.0"
            exit 1
          fi
          if [ -z "$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG")" ]; then
            echo "::error::$TAG is not a tag in $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then echo "dry-run=true" >> "$GITHUB_OUTPUT"; else echo "dry-run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Plan
        id: plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPOS: ${{ inputs.repos || '' }}
          DRY_RUN: ${{ steps.tag.outputs.dry-run }}
          STAGE: ${{ inputs.stage || 'auto' }}
          SKIP_SOAK: ${{ inputs.skip_soak == true }}
        run: |
          set -- --tag "$TAG" --repos "$REPOS" --stage "$STAGE"
          if [ "$SKIP_SOAK" = "true" ]; then set -- "$@" --skip-soak; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/rollout.mjs plan "$@"

  canary:
    name: Canary
    needs: plan
    if: needs.plan.outputs.canary != '[]'
    uses: ./.github/workflows/rollout-wave.yml
    # The wave reads the App key from the `rollout` environment; a called
    # workflow sees no secrets unless the caller passes them on.
    secrets: inherit
    with:
      adopters: ${{ needs.plan.outputs.canary }}
      tag: ${{ needs.plan.outputs.tag }}
      dry-run: ${{ needs.plan.outputs.dry-run == 'true' }}
      major: ${{ needs.plan.outputs.major == 'true' }}

  # The automatic gate for a patch or minor release: the canary's update pull
  # request must pass its checks and merge before any other repo gets one.
  # A dry run opens nothing to wait for, and a major waits for the owner.
  canary-merged:
    name: Canary merged / ${{ matrix.adopter.name }}
    needs: [plan, canary]
    if: >-
      !cancelled() && needs.canary.result == 'success'
      && needs.plan.outputs.dry-run != 'true' && needs.plan.outputs.major != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: rollout
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        adopter: ${{ fromJSON(needs.plan.outputs.canary) }}
    steps:
      # Read-only, for the one canary repo: its pin, pull request and checks.
      - name: Mint a token for ${{ matrix.adopter.repo }}
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_KIT_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_KIT_BOT_KEY }}
          owner: ${{ matrix.adopter.owner }}
          repositories: ${{ matrix.adopter.name }}
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for the update to merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ADOPTER: ${{ toJSON(matrix.adopter) }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/rollout.mjs wait-merge --adopter "$ADOPTER" --tag "$TAG" --timeout-minutes 60

  # A patch or minor release soaks on the canary: this run ends here, and
  # rollout-resume.yml starts the later waves once the soak is over and the
  # canary is healthy. It finds this run by this job's name.
  defer:
    name: Later waves wait for the soak
    needs: [plan, canary-merged]
    if: >-
      !cancelled() && needs.canary-merged.result == 'success' && needs.plan.outputs.later == 'deferred'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say when the later waves start
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          HOURS: ${{ needs.plan.outputs.soak-hours }}
        run: echo "The canary took $TAG. The public and private waves start once it has run it for $HOURS hours and is healthy (rollout-resume.yml looks every hour); run Rollout with stage later and skip_soak to start them now." >> "$GITHUB_STEP_SUMMARY"

  # The later waves' own run (stage later): the canary must have soaked and be
  # healthy, unless the owner skipped the soak.
  soak:
    name: Soak and canary health
    needs: plan
    if: needs.plan.outputs.later == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rollout
    permissions:
      contents: read
    steps:
      # Read-only, for the canary repos: their pin, update pull request and checks.
      - name: Mint a token for the canary
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_KIT_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_KIT_BOT_KEY }}
          owner: ${{ needs.plan.outputs.canary-owner }}
          repositories: ${{ needs.plan.outputs.canary-names }}
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the soak and the canary's health
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CANARIES: ${{ needs.plan.outputs.canaries }}
          HOURS: ${{ needs.plan.outputs.soak-hours }}
        run: node scripts/rollout.mjs soak-check --tag "$TAG" --canaries "$CANARIES" --soak-hours "$HOURS" --require-ready

  public:
    name: Public
    needs: [plan, canary, canary-merged, soak]
    # A failed canary, one whose update didn't merge, or a soak that isn't
    # over stops the rollout; a skipped one (none picked, a dry run, or a
    # major) doesn't. A deferred run leaves them to rollout-resume.yml.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.public != '[]' && needs.plan.outputs.later != 'deferred'
      && (needs.canary.result == 'success' || needs.canary.result == 'skipped')
      && (needs.canary-merged.result == 'success' || needs.canary-merged.result == 'skipped')
      && (needs.soak.result == 'success' || needs.soak.result == 'skipped')
    uses: ./.github/workflows/rollout-wave.yml
    # The wave reads the App key from the `rollout` environment; a called
    # workflow sees no secrets unless the caller passes them on.
    secrets: inherit
    with:
      adopters: ${{ needs.plan.outputs.public }}
      tag: ${{ needs.plan.outputs.tag }}
      dry-run: ${{ needs.plan.outputs.dry-run == 'true' }}
      major: ${{ needs.plan.outputs.major == 'true' }}

  private:
    name: Private
    needs: [plan, canary, canary-merged, soak, public]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.private != '[]' && needs.plan.outputs.later != 'deferred'
      && (needs.canary.result == 'success' || needs.canary.result == 'skipped')
      && (needs.canary-merged.result == 'success' || needs.canary-merged.result == 'skipped')
      && (needs.soak.result == 'success' || needs.soak.result == 'skipped')
      && (needs.public.result == 'success' || needs.public.result == 'skipped')
    uses: ./.github/workflows/rollout-wave.yml
    # The wave reads the App key from the `rollout` environment; a called
    # workflow sees no secrets unless the caller passes them on.
    secrets: inherit
    with:
      adopters: ${{ needs.plan.outputs.private }}
      tag: ${{ needs.plan.outputs.tag }}
      dry-run: ${{ needs.plan.outputs.dry-run == 'true' }}
      major: ${{ needs.plan.outputs.major == 'true' }}

  # Any failure, in a real rollout, reaches the owner as an issue here.
  report:
    name: Report a failure
    needs: [plan, canary, canary-merged, defer, soak, public, private]
    if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # this run's jobs
      issues: write # the "release-kit: rollout" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag || inputs.tag || github.event.release.tag_name }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/rollout.mjs report --tag "$TAG" --run-id "$RUN_ID"
