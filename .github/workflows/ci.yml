# The kit's own tests: unit tests, end-to-end runs against throwaway repos,
# actionlint over every workflow the kit ships or writes, and check-jsonschema
# over the dependabot.yml apply writes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Once with the npm the runner ships, once with npm 12, which refuses git
  # dependencies unless .npmrc allows them (the kit installs as one).
  test:
    name: test (npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        npm: [bundled, "12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tar.gz" | sha256sum --check
          tar xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Validates the dependabot.yml apply writes against SchemaStore's Dependabot schema.
      - name: Install check-jsonschema
        env:
          VERSION: 0.38.2
        run: pipx install "check-jsonschema==$VERSION"
      - name: Use npm ${{ matrix.npm }}
        if: matrix.npm != 'bundled'
        env:
          NPM_VERSION: ${{ matrix.npm }}
        run: npm install --global "npm@$NPM_VERSION"
      - run: npm test

  # The shipped workflows, called the way a repo in reusable mode calls them.
  reusable-commits:
    name: Reusable commit check
    uses: ./.github/workflows/commits.yml
