# release-kit: the release train. On a schedule, and from "Run workflow", it
# cuts a release when a feature, fix, performance change or breaking change
# has landed on main since the last tag, with the bump those commits call for.
# Weeks with only docs, chores or tests release nothing.
#
# A push made with the workflow's GITHUB_TOKEN starts no other workflow, and
# branch protection rejects a commit on main without its required checks. So
# the train starts the checks itself (workflow_dispatch is the one trigger
# GitHub allows from that token): it pushes the release commit to a temporary
# release-train/vX.Y.Z branch, runs the workflows listed in .release.json
# train.checks there, and only when they pass pushes main and the tag. Then it
# starts the Release workflow on the tag. Its pushes start nothing else, so the
# train can't trigger itself. No extra secret is needed.
#
# Turned on with apply.mjs --train (the schedule comes from .release.json), or
# called from n8watkins/release-kit:
#   uses: n8watkins/release-kit/.github/workflows/release-train.yml@vX.Y.Z
name: Release train

on:
  # No schedule: this copy is the one other repos call; the kit releases itself by hand.
  workflow_dispatch:
    inputs:
      bump:
        description: "auto: release only user-facing work, with the bump it calls for"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: "Plan and run the checks, but cut nothing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      bump:
        description: "auto, patch, minor, major or x.y.z"
        type: string
        default: auto
      dry-run:
        description: "Plan and run the checks, but cut nothing"
        type: boolean
        default: false
      release-workflow:
        description: "The caller's workflow file that publishes a tag"
        type: string
        default: release.yml

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  plan:
    name: Anything to release?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      node: ${{ steps.setup.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and the commits since the last one
          persist-credentials: false

      # Called from another repo: run the kit's scripts at the exact commit the
      # caller pinned. A vendored copy runs the repo's own scripts/release-kit.
      - name: Fetch the release-kit scripts
        if: job.workflow_repository != '' && job.workflow_repository != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit-source
          sparse-checkout: template/scripts/release-kit
          persist-credentials: false

      - name: Locate the release-kit scripts and the Node version
        id: setup
        run: |
          if [ -d .release-kit-source ]; then
            mv .release-kit-source/template/scripts/release-kit "$RUNNER_TEMP/release-kit"
            rm -rf .release-kit-source
            echo "RELEASE_KIT=$RUNNER_TEMP/release-kit" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KIT=scripts/release-kit" >> "$GITHUB_ENV"
          fi
          # The Node version: .release.json "node", else .nvmrc or .node-version, else 22.
          node=$(jq -r '.node // empty | tostring' .release.json 2>/dev/null || true)
          for file in .nvmrc .node-version; do
            if [ -z "$node" ] && [ -f "$file" ]; then node=$(tr -d ' \r\nv' < "$file"); fi
          done
          if ! printf '%s' "$node" | grep -Eqx '[0-9]+(\.[0-9x]+){0,2}'; then node=22; fi
          echo "node=$node" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.setup.outputs.node }}

      # Fails (and cuts nothing) when the repo has no release tag yet, or the
      # last tag doesn't match package.json: an unattended run doesn't guess.
      - name: Plan
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: node "$RELEASE_KIT/release.mjs" --plan "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
          SINCE: ${{ steps.plan.outputs.since }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            echo "Next release: v$VERSION ($REASON since $SINCE)." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            node "$RELEASE_KIT/notes.mjs" --from "$SINCE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release: $REASON since $SINCE." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same checks the Release workflow runs on the tag, on the commit the
  # train is about to tag: a red main is never tagged.
  check:
    name: Checks
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.node }}
          cache: npm

      - run: npm ci
      - run: npm run release:check

  cut:
    name: Cut ${{ needs.plan.outputs.tag }}
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 90 # it waits for train.checks
    permissions:
      contents: write # push the release commit, the tag and the temporary check branch
      actions: write # start train.checks and the Release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Fetch the release-kit scripts
        if: job.workflow_repository != '' && job.workflow_repository != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit-source
          sparse-checkout: template/scripts/release-kit
          persist-credentials: false

      - name: Locate the release-kit scripts
        run: |
          if [ -d .release-kit-source ]; then
            mv .release-kit-source/template/scripts/release-kit "$RUNNER_TEMP/release-kit"
            rm -rf .release-kit-source
            echo "RELEASE_KIT=$RUNNER_TEMP/release-kit" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KIT=scripts/release-kit" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.node }}

      # Exactly the commit that was planned and checked. train.mjs commits and
      # tags it, runs .release.json train.checks on it (the workflows branch
      # protection requires), pushes main and the tag atomically, and starts
      # the Release workflow on the tag. If main moved, nothing is released.
      - name: Cut, check, push and publish
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow || 'release.yml' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in main|master) ;; *) echo "::error::The release train runs on main or master, not '$BRANCH'."; exit 1 ;; esac
          git switch --force-create "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node "$RELEASE_KIT/train.mjs" --version "$VERSION" --release-workflow "$RELEASE_WORKFLOW"
