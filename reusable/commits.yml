# release-kit (reusable): every pushed commit follows Conventional Commits.
# The steps live in the release-kit repo, pinned below; apply.mjs updates the pin.
name: Commit messages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # the release train runs it on its release commit

permissions:
  contents: read

jobs:
  check:
    uses: KIT_REPO/.github/workflows/commits.yml@KIT_REF
