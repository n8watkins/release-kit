# release-kit: every pushed commit follows Conventional Commits, including
# commits that skipped the local hook (an agent, a web edit, --no-verify).
name: Commit messages

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          # A new branch or a force push has no usable "before": check the last commit only.
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$HEAD_SHA~1"; fi
          node scripts/release-kit/commit-msg.mjs --range "$from..$HEAD_SHA"
