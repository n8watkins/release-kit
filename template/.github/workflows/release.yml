# release-kit: published by pushing a vX.Y.Z tag (npm run release -- --push).
# Verify, then publish, as two jobs: only the publish job can write to the repo.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.kind.outputs.baseline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes need the previous tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # npm run release -- --baseline makes a tag-only "baseline": verify it,
      # but don't publish a release for it.
      - name: Release or baseline tag
        id: kind
        run: |
          # checkout can store the pushed tag as a lightweight tag; fetch the annotated one.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          if git tag -l --format='%(contents)' "${{ github.ref_name }}" | grep -q "release-kit baseline"; then
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag matches every version file
        run: node scripts/release-kit/release.mjs --verify-tag "${{ github.ref_name }}"

      - name: Install
        run: npm ci

      - name: Checks (lint, types, tests, build)
        run: npm run release:check

      # Optional: a repo that ships files (an extension zip, an installer)
      # defines release:artifacts to write them into release-artifacts/.
      - name: Artifacts
        run: |
          mkdir -p release-artifacts
          if npm run | grep -q "^  release:artifacts$"; then npm run release:artifacts; fi
          cd release-artifacts
          if [ -n "$(ls -A)" ]; then sha256sum * > SHA256SUMS.txt; cat SHA256SUMS.txt; fi

      - name: Release notes
        run: node scripts/release-kit/notes.mjs --to "${{ github.ref_name }}" > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release-notes.md
            release-artifacts/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the GitHub Release
    needs: verify
    if: needs.verify.outputs.baseline != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-artifacts/*)
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Verify the uploaded files
        if: hashFiles('release-artifacts/SHA256SUMS.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir downloaded
          cd downloaded
          sha256sum --check SHA256SUMS.txt
